# Diagnostic version on the pages-diag branch only: no build, no deploy.
# Dispatched by hand through the registered pages.yml name with ref=pages-diag.
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the Pages configuration as GitHub stores it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "repo: $GITHUB_REPOSITORY  ref: $GITHUB_REF"
          echo "== GET /pages"
          gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1 || true
          echo
          echo "== GET /pages/builds/latest (legacy Jekyll builds)"
          gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" 2>&1 || true
          echo
          echo "== PUT build_type=workflow, with the error shown"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow 2>&1 || true
          echo
          echo "== GET /pages afterwards"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type, source, status, html_url}' 2>&1 || true
